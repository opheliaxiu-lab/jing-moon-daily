<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Jing’s v4.0</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="jing-icon-180.png" />
  <meta name="theme-color" content="#f7f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d1b1a" media="(prefers-color-scheme: dark)">
  <style>
    :root{
      --bg:#f7f3ee; --card:#ffffffcc; --text:#2e2926; --muted:#837973;
      --line:#e7dfd7; --accent:#9b8576; --soft:#efe7df; --input:#fbf8f5;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark){
      :root{--bg:#1d1b1a;--card:#2a2725cc;--text:#f3eee8;--muted:#b7aaa0;--line:#3a3531;--accent:#d5c1b0;--soft:#342f2b;--input:#24211f;}
    }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Noto Sans TC",sans-serif;}
    .wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 18px 36px;}
    header{padding:8px 2px 18px}.kicker{font-size:13px;color:var(--muted);letter-spacing:.04em}.title{font-size:30px;font-weight:750;margin:6px 0 4px}.date{font-size:15px;color:var(--muted)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin:14px 0;box-shadow:0 10px 28px #00000010;backdrop-filter: blur(14px);}
    h2{font-size:18px;margin:0 0 14px}.row{display:flex;gap:10px;align-items:center;margin:9px 0}.row label{min-width:58px;color:var(--muted);font-size:14px}.field,select,input[type=number],input[type=text]{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--input);color:var(--text);padding:12px;font-size:16px;outline:none}select{appearance:none}.checks{display:grid;gap:10px}.check{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--input)}input[type=checkbox]{width:21px;height:21px;accent-color:var(--accent)}
    .triple{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.num{text-align:center}.fund{padding:14px 0;border-top:1px solid var(--line)}.fund:first-child{border-top:0;padding-top:0}.fundHead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.fundName{font-weight:700}.remain{font-weight:750}.meta{font-size:13px;color:var(--muted);margin-top:5px}.spend{display:flex;gap:8px;margin-top:10px}.spend input{flex:1}.btn{border:0;border-radius:14px;background:var(--accent);color:var(--bg);padding:0 14px;font-size:15px;font-weight:700}.subbtn{border:1px solid var(--line);border-radius:14px;background:var(--soft);color:var(--text);padding:10px 12px;font-size:14px}.small{font-size:13px;color:var(--muted);line-height:1.5}.history{display:none}.history.open{display:block}.pill{display:inline-block;background:var(--soft);border-radius:999px;padding:6px 10px;font-size:13px;color:var(--muted);margin-top:8px}
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="kicker">Jing’s v4.0</div>
      <div class="title">今天也是新的開始</div>
      <div class="date" id="todayText"></div>
    </header>

    <section class="card">
      <h2>今日三件事</h2>
      <div class="row"><label>工作</label><input id="work" class="field" placeholder="今天最重要的一件事"></div>
      <div class="row"><label>生活</label><input id="life" class="field" placeholder="今天最重要的一件事"></div>
      <div class="row"><label>靈性</label><input id="spirit" class="field" placeholder="今天最重要的一件事"></div>
    </section>

    <section class="card">
      <h2>今日狀態</h2>
      <div class="row"><label>睡眠</label><select id="sleep"><option>不錯</option><option selected>普通</option><option>疲憊</option></select></div>
      <div class="row"><label>心情</label><select id="mood"><option>平靜</option><option selected>普通</option><option>低落</option></select></div>
      <div class="row"><label>體力</label><select id="energy"><option>有精神</option><option selected>普通</option><option>很累</option></select></div>
    </section>

    <section class="card">
      <h2>今日照顧自己</h2>
      <div class="checks">
        <label class="check"><input type="checkbox" id="med">服藥</label>
        <label class="check"><input type="checkbox" id="water">喝水</label>
        <label class="check"><input type="checkbox" id="sun">曬太陽</label>
        <label class="check"><input type="checkbox" id="journal">寫紙本手帳</label>
      </div>
    </section>

    <section class="card" id="weekdayCard">
      <h2>平日模式</h2>
      <label class="check"><input type="checkbox" id="yoga">中午 Rumbo 瑜伽伸展</label>
      <div class="triple" style="margin-top:12px">
        <div><label class="small">待辦</label><input id="docTodo" class="num" type="number" min="0" value="0"></div>
        <div><label class="small">處理中</label><input id="docDoing" class="num" type="number" min="0" value="0"></div>
        <div><label class="small">已完成</label><input id="docDone" class="num" type="number" min="0" value="0"></div>
      </div>
      <div class="row" style="margin-top:12px"><label>番茄鐘</label><input id="tomato" type="number" min="0" max="20" value="0"></div>
    </section>

    <section class="card" id="weekendCard">
      <h2>週末模式</h2>
      <input id="chore1" class="field" placeholder="家事 1" style="margin-bottom:10px">
      <input id="chore2" class="field" placeholder="家事 2" style="margin-bottom:10px">
      <input id="chore3" class="field" placeholder="家事 3">
      <div class="checks" style="margin-top:12px">
        <label class="check"><input type="checkbox" id="slowJog">超慢跑</label>
        <label class="check"><input type="checkbox" id="walk">散步</label>
        <label class="check"><input type="checkbox" id="weekendYoga">瑜伽伸展</label>
      </div>
    </section>

    <section class="card">
      <h2>生活基金袋</h2>
      <div id="funds"></div>
      <div class="pill">每月 1 日自動重置，舊月份保留在本機紀錄。</div>
    </section>

    <section class="card">
      <h2>歷史</h2>
      <p class="small">過去每日紀錄收在這裡。平常不打擾，需要時再展開。</p>
      <button class="subbtn" onclick="toggleHistory()">查看最近紀錄</button>
      <div id="history" class="history small"></div>
    </section>
  </main>
<script>
const fundDefaults=[['日常餐桌袋',800],['靜謐自己',400],['風格飾品',500],['微小幸福',200],['沉澱袋',300]];
const dailyKeys=['work','life','spirit','sleep','mood','energy','med','water','sun','journal','yoga','docTodo','docDoing','docDone','tomato','chore1','chore2','chore3','slowJog','walk','weekendYoga'];
const pad=n=>String(n).padStart(2,'0');
function dateKey(d=new Date()){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function monthKey(d=new Date()){return `${d.getFullYear()}-${pad(d.getMonth()+1)}`}
function zhDate(d=new Date()){return d.toLocaleDateString('zh-Hant-TW',{year:'numeric',month:'2-digit',day:'2-digit',weekday:'long'})}
let today=dateKey(), month=monthKey();
document.getElementById('todayText').textContent=zhDate();
function loadJSON(k,fallback){try{return JSON.parse(localStorage.getItem(k))??fallback}catch{return fallback}}
function saveJSON(k,v){localStorage.setItem(k,JSON.stringify(v))}
function dailyStore(){return loadJSON('jings_daily_records',{})}
function saveDaily(obj){const all=dailyStore(); all[today]=obj; saveJSON('jings_daily_records',all)}
function currentDaily(){const all=dailyStore(); return all[today]||{}}
function loadDaily(){const data=currentDaily(); dailyKeys.forEach(id=>{const el=document.getElementById(id); if(!el)return; if(el.type==='checkbox')el.checked=!!data[id]; else if(data[id]!==undefined)el.value=data[id];});}
function bindDaily(){dailyKeys.forEach(id=>{const el=document.getElementById(id); if(!el)return; el.addEventListener('input',()=>{const data=currentDaily(); data[id]=el.type==='checkbox'?el.checked:el.value; saveDaily(data);}); el.addEventListener('change',()=>{const data=currentDaily(); data[id]=el.type==='checkbox'?el.checked:el.value; saveDaily(data);});});}
function setupMode(){const weekend=[0,6].includes(new Date().getDay()); document.getElementById('weekdayCard').style.display=weekend?'none':'block'; document.getElementById('weekendCard').style.display=weekend?'block':'none';}
function fundStore(){return loadJSON('jings_funds',{})}
function ensureMonthFunds(){const all=fundStore(); if(!all[month]){all[month]=fundDefaults.map(([name,limit])=>({name,limit,spent:0,items:[]})); saveJSON('jings_funds',all)} return all[month]}
function saveMonthFunds(funds){const all=fundStore(); all[month]=funds; saveJSON('jings_funds',all)}
function renderFunds(){const funds=ensureMonthFunds(); const root=document.getElementById('funds'); root.innerHTML=''; funds.forEach((f,i)=>{const remain=f.limit-f.spent; const div=document.createElement('div'); div.className='fund'; div.innerHTML=`<div class="fundHead"><div class="fundName">${f.name}</div><div class="remain">剩 NT$${remain}</div></div><div class="meta">本月 NT$${f.limit}｜已花費 NT$${f.spent}</div><div class="spend"><input type="number" min="0" inputmode="numeric" placeholder="輸入花費金額" id="fundInput${i}"><button class="btn" onclick="addFund(${i})">加入</button></div>`; root.appendChild(div);});}
function addFund(i){const input=document.getElementById('fundInput'+i); const amount=parseInt(input.value,10); if(!amount||amount<1)return; const funds=ensureMonthFunds(); funds[i].spent+=amount; funds[i].items.push({amount,date:today}); saveMonthFunds(funds); renderFunds();}
function toggleHistory(){const el=document.getElementById('history'); el.classList.toggle('open'); const all=dailyStore(); const keys=Object.keys(all).sort().reverse().slice(0,7); el.innerHTML=keys.length?keys.map(k=>`<p><b>${k}</b><br>工作：${all[k].work||''}<br>生活：${all[k].life||''}<br>靈性：${all[k].spirit||''}</p>`).join(''):'尚無歷史紀錄。';}
setupMode(); loadDaily(); bindDaily(); renderFunds();
if('serviceWorker' in navigator){/* no service worker required for this simple PWA */}
</script>
</body>
</html>
