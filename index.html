<!doctype html>
<html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Jing’s</title>
<link rel='apple-touch-icon' href='jing-icon-180.png'>
<link rel='manifest' href='manifest.webmanifest'>
<style>
body{font-family:-apple-system;background:#F7F3EC;color:#3B3835;max-width:720px;margin:auto;padding:20px}
section{background:#FFFCF8;border:1px solid #E6DED2;border-radius:28px;padding:24px;margin:18px 0}
button,input{font:inherit} input{width:100%;padding:14px;border-radius:18px;border:1px solid #E6DED2}
.row{display:flex;justify-content:space-between;align-items:center;border:1px solid #E6DED2;border-radius:20px;padding:14px;margin:10px 0}
.chip{padding:10px 14px;border-radius:999px;border:1px solid #E6DED2;background:white;margin:4px}
.active{background:#4A4743;color:white}
small{color:#7A746D}
</style></head>
<body>
<h1>Jing’s</h1>
<p id='quote'></p>

<section>
<h2>今天的我</h2>
<div id='moods'></div>
</section>

<section>
<h2>今天最重要的一件事</h2>
<input placeholder='今天只留一件事就好'>
</section>

<section>
<h2>最基本照顧</h2>
<div id='care'></div>
</section>

<section>
<h2>今天有寫紙本手帳嗎？</h2>
<div class='row'><span>紙本手帳</span><span id='journal'>○</span></div>
<small id='journalPrompt'></small>
</section>

<section>
<h2>本週生活袋</h2>
<div id='bags'></div>
</section>

<section id='weekday'>
<h2>平日瑜伽伸展</h2>
<div id='yoga'></div>
</section>

<section id='weekend' style='display:none'>
<h2>週末家事</h2>
<div id='chores'></div>
<h2>週末運動</h2>
<div id='exercise'></div>
</section>

<script>
const prompts=['今天不用追回昨天。','慢慢來也算前進。','今天活著就很好。'];
const jp=['今天最想放下什麼？','今天有哪一刻比較輕鬆？','今天有沒有好好吃飯？'];

quote.innerText=prompts[new Date().getDate()%prompts.length];
journalPrompt.innerText=jp[new Date().getDate()%jp.length];

const moods=['我今天還可以','我在撐','我想哭','我凍住了'];
moods.forEach(m=>{
const b=document.createElement('button');
b.className='chip';
b.innerText=m;
b.onclick=()=>{document.querySelectorAll('#moods .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');}
moods.appendChild?0:0;
document.getElementById('moods').appendChild(b);
});

['吃藥','喝水','洗澡','睡覺'].forEach(t=>{
const r=document.createElement('div');
r.className='row';
r.innerHTML='<span>'+t+'</span><span>○</span>';
r.onclick=()=>{r.querySelector('span:last-child').innerText=r.querySelector('span:last-child').innerText==='○'?'✓':'○'}
care.appendChild(r);
});

[['日常餐桌',700],['靜謐自己',300],['個人風格',400],['微光幸福',200],['月光沉澱',400]].forEach(t=>{
const r=document.createElement('div');
r.className='row';
r.innerHTML='<span>'+t[0]+'</span><small>NT$ '+t[1]+'</small>';
bags.appendChild(r);
});

['星期一｜肩頸伸展','星期二｜髖部伸展','星期三｜恢復日','星期四｜睡前伸展','星期五｜放鬆版'].forEach(t=>{
const r=document.createElement('div');
r.className='row';
r.innerHTML='<span>'+t+'</span><span>○</span>';
yoga.appendChild(r);
});

['洗衣服','補日用品','整理制服與包包'].forEach(t=>{
const r=document.createElement('div');
r.className='row';
r.innerHTML='<span>'+t+'</span><span>○</span>';
chores.appendChild(r);
});

['超慢跑或散步','親子散步','瑜伽延長版'].forEach(t=>{
const r=document.createElement('div');
r.className='row';
r.innerHTML='<span>'+t+'</span><span>○</span>';
exercise.appendChild(r);
});

const w=[0,6].includes(new Date().getDay());
weekend.style.display=w?'block':'none';
weekday.style.display=w?'none':'block';
</script>
</body></html>
